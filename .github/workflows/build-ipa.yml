name: IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: User-supplied HTTPS YouTube IPA URL (iOS 16 base, 21.33.6)
        required: true
        type: string
      ipa_url_ios17:
        description: User-supplied HTTPS YouTube IPA URL (iOS 17+ base, 21.41.5). Leave empty to build only iOS 16.
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    needs: plan
    uses: ./.github/workflows/build-deb.yml

  plan:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Collect IPA bases
        id: targets
        env:
          IPA_URL: ${{ inputs.ipa_url }}
          IPA_URL_IOS17: ${{ inputs.ipa_url_ios17 }}
        run: python3 Tools/ipa_workflow.py plan >> "$GITHUB_OUTPUT"

  package:
    name: Package ${{ matrix.target.label }}
    needs: [build, plan]
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: YTKACE-deb-rootless
          path: packages

      - name: Setup
        run: brew install ldid dpkg

      - name: YouTube
        env:
          IPA_URL: ${{ inputs.ipa_url }}
          IPA_URL_IOS17: ${{ inputs.ipa_url_ios17 }}
          IPA_TARGET: ${{ matrix.target.label }}
          GH_TOKEN: ${{ github.token }}
        run: python3 Tools/ipa_workflow.py download --target "$IPA_TARGET"

      - name: Inject
        id: inject
        env:
          IPA_TARGET: ${{ matrix.target.label }}
        run: |
          mkdir deb-root
          dpkg-deb -x packages/*.deb deb-root
          export LDID="$(brew --prefix)/bin/ldid"
          tweak_version="$(awk '/^Version:/ {print $2}' control)"
          output="$(python3 Tools/ipa_workflow.py name --target "$IPA_TARGET" --tweak-version "$tweak_version")"
          bash Scripts/sideload-repack.sh YouTube.ipa deb-root/var/jb/Library/MobileSubstrate/DynamicLibraries/YTKACE.dylib "$output"
          bash Tools/verify-artifacts.sh deb-root/var/jb/Library/MobileSubstrate/DynamicLibraries/YTKACE.dylib "$output"
          echo "ipa=$output" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: YTKACE-IPA-${{ matrix.target.label }}
          path: ${{ steps.inject.outputs.ipa }}
          if-no-files-found: error
